# Configuracion del orquestador nocturno de la prueba piloto
# (src/proyecto_grado/piloto, diseno en docs/diseno_piloto_proceso_nocturno.md).
#
# Todas las rutas son relativas a la raiz del proyecto. Ningun valor de este
# archivo es una credencial: la base se configura con REGISTEL_DB_HOST/PORT/
# USER/PASSWORD, el entorno con PILOTO_ENTORNO y S3 con PILOTO_S3_BUCKET y
# PILOTO_S3_PREFIJO.

candidato:
  nombre: C3
  descripcion: >-
    XGBoost en regimen ordinario con correccion multiplicativa de 14 dias;
    referencia de 52 semanas en regimen raro (docs/preregistro_correccion_nivel.md).
  # Constancia exigida por el diseno: C3 fue el elegido en validacion, pero no
  # supero la confirmacion preregistrada.
  nota: >-
    C3 no supero la confirmacion preregistrada (su MAE en evaluacion quedo
    0,0025 por encima del candidato 1); se usa en la piloto por decision explicita.

# Hora de Colombia para todo calculo de fechas (nunca la del sistema operativo).
horario:
  zona: America/Bogota
  inicio_jornada: "04:00"
  # Antes de esta hora la jornada objetivo es la del dia; desde esta hora, la del
  # dia siguiente (corrida anticipada, con D incompleto).
  corte_objetivo: "12:00"
  # Con --fuente bd no se consulta la base en [sin_bd_desde, sin_bd_hasta),
  # salvo --forzar-horario.
  sin_bd_desde: "04:00"
  sin_bd_hasta: "21:00"

extraccion:
  ventana_dias: 7
  ventana_dias_domingo: 35
  margen_pk: 5000
  # Desde esta fecha la piloto guarda sus propios despachos; antes se usa la
  # semilla (seccion 1.2 del diseno).
  inicio_almacen: 2026-09-27

correccion:
  ventana_dias: 14
  # Franjas observadas minimas para que una jornada entre en el factor.
  min_franjas_jornada: 8
  # Rango observado del factor en el backtesting; fuera de el solo se avisa.
  rango_factor: [0.68, 1.08]
  # Ultima jornada del historial de arranque (predicciones del script 43).
  fin_backtest: 2026-10-03

prediccion:
  semanas_referencia_larga: 52

grupos:
  asignacion: configs/piloto/asignacion_grupos.yaml

salidas:
  directorio: data/piloto
  esquema_bd: bd_montebello_recomendaciones

# Entradas congeladas con su SHA-256 esperado. Si alguna falta o no coincide, la
# ejecucion termina en ERROR. En los archivos de texto (.yaml, .json, .csv, .md,
# .txt) el SHA-256 se calcula con finales de linea normalizados a LF, para que
# coincida en Windows y en Ubuntu. `solo_fuente_local: true` marca las entradas
# que solo usa --fuente local.
