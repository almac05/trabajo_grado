# Target configuration for the first reproducible modeling phase.
dataset_version: freeze_20260610_192142
source_path: data/processed/model_ready/despachos_model_ready_freeze_20260610_192142.parquet
target: pasajeros_total
granularity_min: 30
horizon: 1
routes: [1, 3]
operational_only: true
gap_imputation: mark

# Columns explicitly excluded as predictors because they use current or future
# operational information relative to the forecast origin.
exclude_predictors:
  - pasajeros_promedio
  - ocupacion_p95
  - HORA_FIN_FINAL
  - DURACION_MIN_FINAL
  - FIN_TIPO
  - HORA_FIN_FUENTE
  - RECORRIDO_COMPLETO
