repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: bloquear-env
        name: Bloquear archivos .env (credenciales)
        entry: Los archivos .env no se versionan; contienen credenciales.
        language: fail
        files: '(^|/)\.env(\..*)?$'
        exclude: '(^|/)\.env\.example$'
