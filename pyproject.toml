[project]
name = "proyecto_grado"
version = "0.1.0"
description = "Predicción de demanda de pasajeros para apoyo al despacho vehicular - Empresa Montebello"
authors = [
    { name = "Carlos Alex Macías Perdomo", email = "carlos_ale.macias@uao.edu.co" },
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Academic" }
keywords = ["transporte", "demanda", "prediccion", "machine-learning", "uao"]

dependencies = [
    # Datos y análisis
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    # Conexión a MySQL (Registel)
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "mysql-connector-python==9.6.0",
    # Visualización
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "streamlit>=1.36",
    "altair>=5.0",
    # Modelos clásicos y ML
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "prophet>=1.1",
    # Utilidades
    "pyyaml>=6.0",
    "tqdm>=4.66",
    # Calendario festivos Colombia (serie temporal)
    "holidays>=0.46",
]

[project.scripts]
dashboard = "proyecto_grado.dashboard.app:main"

[project.optional-dependencies]
dl = [
    "torch>=2.2",
]
aws = [
    "boto3>=1.34",
    "s3fs>=2024.2",
    "sagemaker>=2.210",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proyecto_grado"]

# ======================================================================
# Ruff (lint + format)
# ======================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ======================================================================
# Mypy
# ======================================================================
[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
exclude = ["notebooks", "tests"]

# ======================================================================
# Pytest
# ======================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"
markers = [
    "unit: pruebas unitarias",
    "integration: pruebas de integración",
    "slow: pruebas lentas",
]
